name: Build NRO

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make sure icon.jpg exists
        run: |
          # hbmenu needs a 256x256 JPEG named icon.jpg next to the Makefile.
          # If it is missing from the repo, write the built-in WinNX icon so the build never ships icon-less.
          if [ ! -s icon.jpg ]; then
            echo "icon.jpg missing - writing the default WinNX icon"
            echo '' | base64 -d > icon.jpg
          fi
          ls -l icon.jpg

      - name: Install libraries
        run: |
          if command -v dkp-pacman >/dev/null 2>&1; then PM=dkp-pacman; else PM=pacman; fi
          $PM -Sy --noconfirm
          $PM -S --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-freetype switch-libjpeg-turbo switch-libpng switch-pkg-config

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=$DEVKITPRO/devkitA64/bin:$DEVKITPRO/portlibs/switch/bin:$PATH
          make -j$(nproc)

      - name: Check the icon is inside the .nro
        run: |
          NRO=WinNX.nro
          SZ=$(od -An -tu4 -j24 -N4 "$NRO" | tr -d ' ')
          MAGIC=$(dd if="$NRO" bs=1 skip="$SZ" count=4 2>/dev/null)
          if [ "$MAGIC" != "ASET" ]; then echo "::error::No asset section in $NRO - the icon did not get embedded"; exit 1; fi
          ICON=$(od -An -tu8 -j$((SZ+16)) -N8 "$NRO" | tr -d ' ')
          echo "icon bytes embedded: $ICON"
          if [ "$ICON" -le 0 ]; then echo "::error::Icon is empty in $NRO"; exit 1; fi

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: WinNX
          path: "*.nro"
          if-no-files-found: error
