name: Build NRO

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make sure icon.jpg exists
        run: |
          # hbmenu needs a 256x256 JPEG named icon.jpg next to the Makefile.
          if [ ! -s icon.jpg ]; then
            echo "icon.jpg missing - writing the default WinNX icon"
            echo '...[TRUNCATED FOR LENGTH]...' | base64 -d > icon.jpg
          fi
          ls -l icon.jpg

      - name: Install libraries
        run: |
          # Use local dkp-pacman configuration directly without syncing databases to prevent 403 blocks
          if command -v dkp-pacman >/dev/null 2>&1; then PM=dkp-pacman;
          else PM=pacman; fi
          $PM -S --noconfirm --needed switch-sdl2 switch-sdl2_image switch-libpng switch-libjpeg-turbo

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=$DEVKITPRO/devkitA64/bin:$PATH
          make -j$(nproc)

      - name: Check the icon is inside the .nro
        run: |
          NRO=WinNX.nro
          SZ=$(od -An -tu4 -j24 -N4 "$NRO" | tr -d ' ')
          MAGIC=$(dd if="$NRO" bs=1 skip="$SZ" count=4 2>/dev/null)
          if [ "$MAGIC" != "ASET" ]; then echo "::error::Icon missing from NRO structural chunk asset boundary!"; exit 1; fi
          ICON=$(od -An -tu8 -j$((SZ+16)) -N8 "$NRO" | tr -d ' ')
          echo "icon bytes embedded: $ICON"
          if [ "$ICON" -le 0 ]; then echo "::error::Icon allocation size error detected inside NRO envelope!"; exit 1; fi

      - name: Upload NRO
        uses: actions/artifacts@v4
        with:
          name: WinNX
          path: "*.nro"
          if-not-found: error
