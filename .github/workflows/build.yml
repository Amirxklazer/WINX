name: Build NRO

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Pin the image. Use the same tag as your working Îlot14 World repo if you know it
    # (e.g. devkitpro/devkita64:20240202). 'latest' is only the fallback.
    container: devkitpro/devkita64:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libraries
        run: |
          if command -v dkp-pacman >/dev/null 2>&1; then PM=dkp-pacman; else PM=pacman; fi
          $PM -Sy --noconfirm
          $PM -S --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-sdl2_image switch-libjpeg-turbo switch-libpng switch-freetype switch-pkg-config

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=$DEVKITPRO/devkitA64/bin:$DEVKITPRO/portlibs/switch/bin:$PATH
          make -j$(nproc)

      - name: Upload NRO
        uses: actions/upload-artifact@v4
        with:
          name: WinNX
          path: "*.nro"
          if-no-files-found: error
          
